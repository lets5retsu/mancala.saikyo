<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalah AI</title>
<style>
:root{color-scheme:dark;--bg:#101923;--panel:#1c2a38;--text:#f4f1e8;--muted:#aab7c4;--accent:#67d5b5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#24394b,#101923 65%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{width:min(960px,94vw);margin:28px auto}header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:clamp(1.8rem,5vw,2.7rem);letter-spacing:.04em}.sub{color:var(--muted);margin-top:5px}
.panel{background:#1c2a38ef;border:1px solid #ffffff1c;border-radius:18px;padding:18px;box-shadow:0 18px 50px #0005}
.status{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.pill{border:1px solid #ffffff2b;border-radius:999px;padding:7px 12px;color:var(--muted);font-size:.9rem}
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.score{background:#101923;border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}.score strong{font-size:1.8rem;color:var(--accent)}
.board{background:linear-gradient(135deg,#89552f,#5c351f);border:8px solid #432718;border-radius:28px;padding:18px 14px;display:grid;grid-template-columns:72px 1fr 72px;gap:12px;align-items:stretch;box-shadow:inset 0 4px 12px #0005}
.store{border-radius:40px;background:linear-gradient(145deg,#3d2418,#25150f);border:2px solid #b77b42;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:190px}
.store span{color:#d8b58c;font-size:.8rem}.store b{font-size:2rem;margin-top:8px}
.pits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-content:center}.rowlabel{grid-column:1/-1;color:#f1d1a4;font-size:.8rem;text-align:center}
.pit{aspect-ratio:1/1;min-width:0;border:2px solid #b77b42;border-radius:50%;background:radial-gradient(circle at 35% 25%,#80502e,#382014 75%);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:inset 0 5px 12px #0008,0 3px 3px #0004;transition:transform .12s,border-color .12s}
.pit:hover:not(:disabled){transform:translateY(-3px);border-color:#ffe0a5}.pit:disabled{cursor:default;opacity:.78}.pit.legal{outline:3px solid var(--accent);outline-offset:2px}
.pit.active{border-color:#fff2b5;box-shadow:0 0 0 4px #ffe39b88,0 0 24px #ffd36b;transform:scale(1.07)}
.pit.active:after{content:"●";position:absolute;top:-9px;right:-5px;color:#fff0b2;font-size:1.05rem;text-shadow:0 1px 5px #000;animation:drop .22s ease-out}
.pit.captured{border-color:#ffdf75;background:radial-gradient(circle at 35% 25%,#a66c35,#4a2815 75%);animation:capturePulse .45s ease-in-out}
@keyframes drop{from{transform:translateY(-13px) scale(.5);opacity:.2}to{transform:translateY(0) scale(1);opacity:1}}
@keyframes capturePulse{0%,100%{box-shadow:inset 0 5px 12px #0008}50%{box-shadow:0 0 0 5px #ffd36b99,0 0 25px #ffd36b}}
.pit .count{font-weight:800;font-size:clamp(1rem,3vw,1.5rem);text-shadow:0 2px 3px #000}.pit .num{color:#e8c59c;font-size:.65rem;margin-top:2px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}button,select{border:0;border-radius:10px;padding:11px 15px;font:inherit}
button{background:var(--accent);color:#10231f;font-weight:750;cursor:pointer}button.secondary{background:#34495b;color:var(--text);border:1px solid #ffffff24}button:disabled{opacity:.5;cursor:not-allowed}
select{background:#101923;color:var(--text);border:1px solid #ffffff30}#message{margin-top:14px;min-height:1.5em;color:#f4d7a4}
.extra{display:none;margin:10px 0 0;padding:10px 14px;border-radius:12px;background:#174c43;border:1px solid #67d5b5;color:#c8fff0;font-weight:800;text-align:center;font-size:1.08rem}
.extra.show{display:block;animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.94);opacity:.3}to{transform:scale(1);opacity:1}}
.rules{color:var(--muted);font-size:.88rem;line-height:1.65;margin-top:16px}.controls label{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
@media(max-width:600px){main{margin:14px auto}.panel{padding:12px}.board{grid-template-columns:48px 1fr 48px;gap:6px;padding:10px 6px;border-width:5px;border-radius:20px}.pits{gap:4px}.store{min-height:140px;border-radius:24px}.store b{font-size:1.45rem}.pit{border-width:1px}.pit .num{font-size:.55rem}}
</style>
</head>
<body>
<main>
<header><div><h1>KALAH <span style="color:var(--accent)">AI</span></h1><div class="sub">人間 vs 学習
